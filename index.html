<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Club Gym Manager · Gestión para gimnasios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- PWA instalable -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Club">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="device-notch"></div>
    <div class="screen" id="app"></div>
  </div>
</div>
<input type="file" id="filePicker" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<!-- test-harness.html reemplaza este script por mock-client.js para poder
     verificar app.js sin un backend real levantado. -->
<script src="supabase-client.js?v=2"></script>
<script src="ads.js"></script>
<script type="module" src="src/router.js"></script>
<script>
// Registra el service worker para que la app sea instalable (Android/desktop)
// y funcione offline. No se registra dentro de la app empaquetada con
// Capacitor (ya es una app nativa, no necesita esto) ni en el
// test-harness (evita cachear una versión vieja mientras se prueba app.js).
if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
