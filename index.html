<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Club Gym Manager · Gestión para gimnasios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- PWA instalable -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Club">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="device-notch"></div>
    <div class="screen" id="app"></div>
  </div>
</div>
<input type="file" id="filePicker" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<!-- test-harness.html reemplaza este script por mock-client.js para poder
     verificar app.js sin un backend real levantado. -->
<script src="supabase-client.js?v=2"></script>
<script src="ads.js"></script>
<!-- Generación y lectura de QR real (Fase 15) — vendorizadas localmente
     (no CDN) para que funcionen offline en la PWA y dentro de la app
     empaquetada con Capacitor. window.qrcode / window.jsQR, ver src/qr.js. -->
<script src="qrcode-generator.min.js"></script>
<script src="jsQR.min.js"></script>
<script type="module" src="src/router.js"></script>
<script>
// Registra el service worker para que la app sea instalable (Android/desktop)
// y funcione offline. No se registra dentro de la app empaquetada con
// Capacitor (ya es una app nativa, no necesita esto) ni en el
// test-harness (evita cachear una versión vieja mientras se prueba app.js).
const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
if ('serviceWorker' in navigator && !isNative) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// Auto-actualización (pedido: "que la app se actualice sola cada vez que
// haya una actualización" — el caso real es la PWA que queda abierta días
// en el celular/tablet de recepción sin que nadie la cierre del todo, así
// que nunca vuelve a pasar por un `load` fresco que ya traería lo último
// por la red sola — ver sw.js, estrategia "network-first").
//
// En vez de depender de acordarse de bumpear un número de versión a mano
// en cada deploy (se rompe la primera vez que alguien lo olvida), se
// compara el contenido REAL de los archivos del shell contra una copia
// fresca de la red (sin cache) cada tanto: si algo cambió — cualquier
// archivo, cualquier deploy — recarga sola. Misma lista que SHELL_FILES en
// sw.js (mantenerlas iguales si se agrega/saca un archivo de una de las
// dos); no hace falta tocar esto por cada feature nueva.
if (!isNative) {
  (function () {
    const CHECK_FILES = [
      'index.html', 'styles.css', 'config.js', 'supabase-client.js', 'ads.js',
      'src/router.js', 'src/state.js', 'src/actions.js', 'src/data.js', 'src/helpers.js',
      'src/screens/auth.js', 'src/screens/owner.js', 'src/screens/admin.js',
      'src/screens/client.js', 'src/screens/trainer.js',
    ];
    let baseline = null;
    let checking = false;

    async function fetchShellText() {
      const parts = await Promise.all(CHECK_FILES.map(f =>
        fetch(f, { cache: 'no-store' }).then(r => r.text()).catch(() => null)));
      return parts.some(p => p === null) ? null : parts.join('\n'); // sin señal a medio camino: no comparar contra un fetch parcial
    }

    async function checkForUpdate() {
      if (checking) return;
      checking = true;
      try {
        const fresh = await fetchShellText();
        if (fresh == null) return;
        if (baseline == null) { baseline = fresh; return; } // primera pasada: fija la base, nada que comparar todavía
        if (fresh !== baseline) location.reload();
      } finally {
        checking = false;
      }
    }

    window.addEventListener('load', () => {
      checkForUpdate();
      // El momento real en que esto importa: volver a la app después de un
      // rato afuera (cambiar de app, prender la pantalla de nuevo) — ahí
      // conviene chequear, no solo confiar en el intervalo.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
      setInterval(checkForUpdate, 15 * 60 * 1000);
    });
  })();
}
</script>
</body>
</html>
